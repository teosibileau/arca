[project]
name = "arca"
version = "0.1.0"
description = "Emisión de Factura C contra los web services de ARCA para monotributistas"
readme = "README.md"
authors = [
    { name = "Teofilo Sibileau", email = "teo.sibileau@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "zeep>=4.2",
    "cryptography>=43.0",
    "pydantic-settings>=2.5",
    "defusedxml>=0.7",
    "oxyde>=0.7.1",
    "requests>=2.32",
]

[project.scripts]
arca = "arca.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
markers = ["live: pega al portal de ARCA con clave fiscal real (se saltea sin ARCA_CLAVE_FISCAL)"]
addopts = "-m 'not live'"

[tool.ruff]
# Ruff es dueño del lint, orden de imports (regla `I`) y formato. Sin isort
# aparte: ruff-I e isort se pelean y nunca convergen (astral-sh/ruff#12733).
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.bandit]
# Los tests usan secretos descartables y asserts a propósito; solo la app.
exclude_dirs = ["tests", ".venv"]
# mcmp.login invoca `docker` con lista de argumentos y sin shell; bandit igual marca
# el import de subprocess (B404), la llamada (B603) y el binario sin path absoluto (B607).
skips = ["B404", "B603", "B607"]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
